[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
publish = false

# Shared dependency versions. Adding a runtime dependency needs human approval (GEN-004).
[workspace.dependencies]
deck-core = { path = "crates/deck-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = { version = "1.0.28", features = ["serde"] }
schemars = { version = "1.2.2", features = ["semver1"] }
ts-rs = { version = "12.0.1", features = ["semver-impl", "serde-json-impl"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Host (apps/desktop/src-tauri). Tauri stays on 2.x (ADR-0001).
tauri = { version = "2.12.1", features = [] }
tauri-build = { version = "2.7.1", features = [] }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-updater = "2.13.2"
tauri-plugin-dialog = "2.8.1"
window-vibrancy = "0.8.1"
windows-version = "0.100.0"
sys-locale = "0.3.2"
getrandom = "0.4.3"
percent-encoding = "2.3.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tracing-appender = "0.2.5"

# Lint levels for all members (members opt in with `[lints] workspace = true`).
# Do not relax these to make code pass (GEN-001, GEN-003).
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# crates/AGENTS.md: library code returns Result instead of panicking.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# PRV-003: output goes through the logging helper, not stdout/stderr.
print_stdout = "deny"
print_stderr = "deny"
