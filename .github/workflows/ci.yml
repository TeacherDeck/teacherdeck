# CI runs exactly what developers run locally: pnpm verify (CI-005). Protected file (CI-006).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Commit messages and DCO (GEN-009)
        if: github.event_name == 'pull_request'
        run: node tools/scripts/check-commits.ts origin/${{ github.base_ref }} HEAD
      - name: Module version bumps (MOD-013)
        if: github.event_name == 'pull_request'
        run: node tools/scripts/check-module-bumps.ts origin/${{ github.base_ref }}
      - name: Installer build smoke test
        run: pnpm tauri build
